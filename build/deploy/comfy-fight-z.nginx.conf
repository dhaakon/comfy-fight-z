# Runtime-only Comfy Fighter Z demo. TLS is renewed by Certbot's existing timer.
server {
    listen 80;
    listen [::]:80;
    server_name comfy-fight-z.dhaakon.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/comfy-fight-z.dhaakon.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://comfy-fight-z.dhaakon.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name comfy-fight-z.dhaakon.com;
    root /var/www/comfy-fight-z.dhaakon.com/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/comfy-fight-z.dhaakon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comfy-fight-z.dhaakon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/comfy-fight-z.dhaakon.com.access.log;
    error_log /var/log/nginx/comfy-fight-z.dhaakon.com.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    expires -1;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /LICENSE {
        default_type text/plain;
    }
    location ~ /\. {
        return 404;
    }
    location ~* \.(png|jpe?g|webp|mp3|ogg|wav|flac|woff2?)$ {
        expires 1h;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
