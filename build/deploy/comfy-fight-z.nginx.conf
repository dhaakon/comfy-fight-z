# Runtime-only Comfy Fighter Z demo. TLS is renewed by Certbot's existing timer.
server {
    listen 80;
    listen [::]:80;
    server_name comfy-fight-z.dhaakon.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/comfy-fight-z.dhaakon.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://comfy-fight-z.dhaakon.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name comfy-fight-z.dhaakon.com;
    root /var/www/comfy-fight-z.dhaakon.com/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/comfy-fight-z.dhaakon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comfy-fight-z.dhaakon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/comfy-fight-z.dhaakon.com.access.log;
    error_log /var/log/nginx/comfy-fight-z.dhaakon.com.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    expires -1;
    gzip on;
    gzip_types text/css application/javascript application/json;

    # Same-origin authoritative multiplayer, isolated for each game mount; games.json feeds every title screen's GAME SELECT.
    location ~ ^/(?:(?:phone-photo-demo|billionaires-brawl|midterm-2026|rogue-ai|ultra)/)?(?:ws|runtime-config\.js|healthz|games\.json)$ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_buffering off;
    }

    location = /LICENSE {
        default_type text/plain;
    }
    location ~ /\. {
        return 404;
    }
    location ~* \.(png|jpe?g|webp|mp3|ogg|wav|flac|mp4|woff2?)$ {
        expires 1h;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
